<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sectorisation & Pré-imprégnation</title>
<style>
:root{
  --bg:#f4f6f9;--sf:#ffffff;--sf2:#f8fafc;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--bd2:#cbd5e1;
  --ac:#0284c7;--ac-h:#0369a1;--ac-bg:#e0f2fe;--ac-tx:#0369a1;
  --ok:#059669;--ok-bg:#d1fae5;--wa:#d97706;--wa-bg:#fef3c7;--er:#dc2626;--er-bg:#fee2e2;
  --sh:0 1px 3px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.03);
  --sh-md:0 4px 12px rgba(15,23,42,.07);
  --r:12px;--rs:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b111a;--sf:#131c28;--sf2:#192433;--tx:#f1f5f9;--mu:#94a3b8;--bd:#233042;--bd2:#334155;
  --ac:#38bdf8;--ac-h:#7dd3fc;--ac-bg:rgba(56,189,248,.14);--ac-tx:#7dd3fc;
  --ok:#34d399;--ok-bg:rgba(52,211,153,.14);--wa:#fbbf24;--wa-bg:rgba(251,191,36,.14);--er:#f87171;--er-bg:rgba(248,113,113,.14);
  --sh:0 1px 3px rgba(0,0,0,.3);--sh-md:0 6px 16px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

/* Header */
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.85rem 1.5rem;background:var(--sf);border-bottom:1px solid var(--bd);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:.65rem;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ac),#2563eb);color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(2,132,199,.3)}
h1{font-size:1.1rem;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{font-size:.78rem;color:var(--mu);display:block;font-weight:400}
.h-acts{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}

/* Controls */
button,select,input{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;gap:.4rem;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:.42rem .75rem;font-weight:500;cursor:pointer;transition:all .15s ease}
button:hover{border-color:var(--bd2);background:var(--sf2)}
button:active{transform:translateY(1px)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 1px 2px rgba(2,132,199,.25)}
button.p:hover{background:var(--ac-h);border-color:var(--ac-h)}
button.ghost{border-color:transparent;background:transparent;color:var(--mu);padding:.32rem .55rem}
button.ghost:hover{background:var(--sf2);color:var(--tx)}
button.danger:hover{background:var(--er-bg);color:var(--er);border-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:.42rem .65rem;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--ac);background:var(--sf);box-shadow:0 0 0 3px var(--ac-bg)}
input[type=number]{width:5.5rem}
input[type=checkbox]{accent-color:var(--ac);width:15px;height:15px;cursor:pointer}

/* Navigation */
.nav-wrap{background:var(--sf);border-bottom:1px solid var(--bd);padding:.55rem 1.5rem}
nav{display:inline-flex;flex-wrap:wrap;gap:.3rem;background:var(--bg);padding:.28rem;border-radius:10px;border:1px solid var(--bd)}
nav button{border:0;background:transparent;color:var(--mu);padding:.42rem .9rem;border-radius:7px;font-weight:500}
nav button:hover{color:var(--tx);background:transparent}
nav button.on{background:var(--sf);color:var(--ac);font-weight:600;box-shadow:var(--sh)}
.cnt{font-size:.75rem;padding:.05rem .42rem;border-radius:99px;background:var(--bd);color:var(--tx);font-weight:600}
nav button.on .cnt{background:var(--ac-bg);color:var(--ac-tx)}

/* Layout & Cards */
main{max-width:1440px;margin:0 auto;padding:1.25rem 1.5rem 3rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.15rem;box-shadow:var(--sh);transition:box-shadow .2s,border-color .15s}
.card h2{font-size:1rem;font-weight:650;margin:0 0 .85rem;display:flex;align-items:center;gap:.5rem;letter-spacing:-.01em}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.15rem}
.row{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;margin-bottom:.65rem}
.row:last-child{margin-bottom:0}
.mu{color:var(--mu);font-size:.83rem}.er{color:var(--er)}.wa{color:var(--wa)}.ok{color:var(--ok)}

/* Dashboard KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1.25rem}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1rem 1.15rem;box-shadow:var(--sh)}
.kpi-lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kpi-val{font-size:1.75rem;font-weight:750;letter-spacing:-.02em;margin:.3rem 0 .2rem;line-height:1.1}
.kpi-sub{font-size:.8rem;color:var(--mu)}
.dash-bar-row{margin-bottom:.85rem}
.dash-bar-row:last-child{margin-bottom:0}

/* Badges & Pills */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.76rem;font-weight:600;padding:.18rem .55rem;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);color:var(--mu)}
.badge.ac{background:var(--ac-bg);color:var(--ac-tx);border-color:transparent}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.wa{background:var(--wa-bg);color:var(--wa);border-color:transparent}
.badge.er{background:var(--er-bg);color:var(--er);border-color:transparent}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--rs)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:var(--sf2);color:var(--mu);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;padding:.55rem .7rem;border-bottom:1px solid var(--bd);text-align:left}
td{padding:.55rem .7rem;border-bottom:1px solid var(--bd);text-align:left}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sf2)}

/* Sectorisation Workspace */
.lay{display:grid;grid-template-columns:300px 1fr;gap:1.25rem;align-items:start}
@media(max-width:860px){.lay{grid-template-columns:1fr}}
.sticky-col{position:sticky;top:4.8rem;max-height:calc(100vh - 6rem);display:flex;flex-direction:column}
.scroll-zone{overflow-y:auto;padding-right:.2rem;margin-top:.5rem}
.zone{min-height:4rem;border-radius:var(--rs);padding:.35rem;border:1.5px dashed transparent;transition:all .15s}
.zone.empty{border-color:var(--bd2);background:var(--sf2);display:grid;place-items:center;text-align:center;padding:1.2rem}
.zone.over{border-color:var(--ac);background:var(--ac-bg)}
.chip,.it{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border:1px solid var(--bd);border-radius:var(--rs);padding:.48rem .65rem;margin:.35rem 0;background:var(--sf);box-shadow:0 1px 2px rgba(0,0,0,.02);cursor:grab;transition:border-color .15s,transform .1s,box-shadow .15s}
.chip:hover,.it:hover{border-color:var(--ac);box-shadow:var(--sh)}
.chip:active,.it:active{cursor:grabbing}
.it{flex-wrap:wrap;background:var(--sf2)}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:1rem;align-items:start}

/* Collapsible Sector Cards */
.sec-card{padding:.9rem 1.05rem}
.sec-card.collapsed{padding:.7rem 1rem}
.sec-card.over{border-color:var(--ac);background:var(--ac-bg)}
.chev{width:26px;height:26px;padding:0;justify-content:center;border-radius:6px;flex-shrink:0}
.chev svg{transition:transform .2s ease}
.sec-card.collapsed .chev svg{transform:rotate(-90deg)}
.sec-compact{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.45rem;padding-top:.45rem;border-top:1px solid var(--bd)}

/* Progress Bar & Legend */
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bd);margin:.65rem 0 .45rem}
.bar.sm{height:6px;margin:0;flex:1;min-width:60px}
.bar i{display:block;border-right:1px solid var(--sf);transition:width .25s ease}
.s0{background:#64748b}.s1{background:var(--ac)}.s2{background:#8b5cf6}
.leg{display:flex;gap:.8rem;font-size:.76rem;color:var(--mu);margin-bottom:.4rem}
.leg span{display:inline-flex;align-items:center;gap:.3rem}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.big{font-size:1.65rem;font-weight:750;letter-spacing:-.02em;line-height:1}

/* Accordions & Alerts */
details{margin-top:.65rem;border-top:1px solid var(--bd);padding-top:.55rem}
summary{cursor:pointer;color:var(--mu);font-weight:500;font-size:.85rem;user-select:none;display:flex;align-items:center;gap:.35rem}
summary:hover{color:var(--tx)}
.alert-wa{display:flex;align-items:center;gap:.45rem;background:var(--wa-bg);color:var(--wa);padding:.42rem .65rem;border-radius:var(--rs);font-size:.82rem;font-weight:500;margin-top:.4rem}
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.75rem 1rem;margin-top:1rem;box-shadow:var(--sh)}
.search-box{position:relative;display:inline-flex;align-items:center}
.search-box input{padding-left:2rem}
.search-box svg{position:absolute;left:.65rem;color:var(--mu);pointer-events:none}
.rule-box{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:.85rem;margin-bottom:.75rem}
button:disabled{opacity:.45;cursor:not-allowed}

/* Import CSV : aperçu modale */
.ovl{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:grid;place-items:start center;padding:2rem 1rem;overflow-y:auto}
.ovl>.card{width:min(980px,100%)}
.mv{max-width:10rem;font-size:.78rem;padding:.2rem .3rem}

/* Impression du plan */
#pr{display:none}
body.printing>header,body.printing>.nav-wrap,body.printing>main{display:none!important}
body.printing>#pr{display:block;padding:1rem;max-width:900px;margin:0 auto}
.pr-sec{page-break-inside:avoid;border:1px solid #cbd5e1;border-radius:8px;padding:.7rem .9rem;margin-bottom:.7rem}
.pr-sec h3{margin:0 0 .4rem;font-size:.95rem}
.pr-sec table{width:100%;border-collapse:collapse;font-size:.8rem}
.pr-sec td,.pr-sec th{border-bottom:1px solid #e2e8f0;padding:.22rem .4rem;text-align:left}
@media print{body{background:#fff;color:#000}#pr{display:block!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    </div>
    <div>
      <h1>Sectorisation & Pré-imprégnation</h1>
      <span class="sub" id="lk">Gestion des surfaces, rotations et dotations</span>
    </div>
  </div>
  <div class="h-acts">
    <button data-act="undo" title="Annuler la dernière action (Ctrl+Z)">↩ Annuler</button>
    <button data-act="link" id="blink" title="Synchroniser avec un fichier local">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Lier un fichier…
    </button>
    <button data-act="impcsv">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
      Importer CSV
    </button>
    <button data-act="imp">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      JSON
    </button>
    <button class="p" data-act="exp">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Exporter
    </button>
    <span class="badge ok" id="sv" hidden></span>
  </div>
  <input type="file" id="file" accept=".json" hidden>
  <input type="file" id="csvfile" accept=".csv,.txt" hidden>
</header>
<div class="nav-wrap"><nav id="nav" aria-label="Sections"></nav></div>
<main id="v"></main>
<div id="pr"></div>

<script>
const K='sectorisation_v1',K2=K+'_bk',CATS={classroom:'Salle de classe',office:'Bureau',sanitary_ext:'Sanitaires externat',sanitary_int:'Sanitaires internat',bedroom:'Chambre',showers:'Douches',canteen:'Self',library:'CDI',gym:'Gymnase',stairs:'Escalier',circulation:'Circulation / Autre'};
const R=(id,label,cat,when,k,a,b,f)=>({id,label,cat,when,k,a,b,f});
const DEF=()=>({setup:10,days:5,cls:{c:25,d:15,v:5},rules:[
R('san_ext','Sanitaires externat','sanitary_ext',null,'rate',1,1,[2,'d']),
R('san_int','Sanitaires internat','sanitary_int',null,'rate',1,1,[1,'d']),
R('off_hi','Bureau très fréquenté','office',{traffic:'high'},'rate',3,1,[1,'d']),
R('off_lo','Bureau faiblement fréquenté','office',{traffic:'low'},'rate',4,1,[1,'d']),
R('cdi','CDI','library',null,'rate',400,60,[1,'d']),
R('sm_t','Self midi, carrelage / sol souple','canteen',{floor:'tile'},'rate',200,60,[1,'d']),
R('sm_f','Self midi, Flotex','canteen',{floor:'flotex'},'rate',200,70,[1,'d']),
R('ss_t','Self soir, carrelage / sol souple','canteen',{floor:'tile'},'rate',600,90,[1,'d']),
R('ss_f','Self soir, Flotex','canteen',{floor:'flotex'},'rate',600,90,[1,'d']),
R('bed','Chambre','bedroom',null,'unit',0,5,[1,'w']),
R('sho','Douches','showers',null,'unit',0,5,[1,'d']),
R('g1','Gymnase, dépoussiérage hebdomadaire, balayeuse (SW750)','gym',null,'rate',2300,60,[1,'w']),
R('g2','Gymnase, dépoussiérage hebdomadaire, manuel','gym',null,'rate',2000,60,[1,'w']),
R('g3','Gymnase, lavage hebdomadaire, autolaveuse (SC500)','gym',null,'rate',2000,60,[1,'w']),
R('g4','Gymnase, lavage hebdomadaire, manuel','gym',null,'rate',1500,60,[1,'w']),
R('stairs','Escalier','stairs',null,'rate',250,60,[1,'d']),
R('circ','Circulation / Autre','circulation',null,'rate',400,60,[1,'d'])]});
const DEFM=()=>[
{id:'f50',label:'Frange EMR 80 50 cm',rules:[{k:'room',c:'san',n:1},{k:'area',c:'~',n:50}]},
{id:'f30',label:'Frange EMR 80 30 cm',rules:[{k:'unit',c:'classroom',u:'tables',n:10}]},
{id:'net',label:'Netty',rules:[{k:'unit',c:'san',u:'cuvettes',n:1}]},
{id:'lav',label:'Lavette microfibre bleue',rules:[{k:'sector',n:0}]},
{id:'hou',label:'Housse Micro flex',rules:[{k:'sector',n:2}]},
{id:'fv',label:'Frange vitre microfibre',rules:[{k:'sector',n:3}]},
{id:'gv',label:'Gant vitre microfibre',rules:[{k:'sector',n:1}]}];
const fresh=()=>({tabs:['Dashboard','Locaux','Secteurs','Semaine','Matériel','Paramètres'],b:[],r:[],s:[],p:DEF(),m:DEFM()});
function norm(){
 if(!S.m)S.m=DEFM();
 if(!S.tabs.includes('Dashboard'))S.tabs.unshift('Dashboard');
 if(!S.tabs.includes('Matériel'))S.tabs.splice(3,0,'Matériel');
 if(!S.tabs.includes('Semaine')){const i=S.tabs.indexOf('Secteurs');S.tabs.splice(i>=0?i+1:2,0,'Semaine')}
 if(!S.p.rules.some(r=>r.id=='circ'))S.p.rules.push(R('circ','Circulation / Autre','circulation',null,'rate',400,60,[1,'d']));
 S.r.forEach(r=>{if(r.category=='classroom'&&r.tables==null)r.tables=10;if(r.category.startsWith('sanitary')&&r.cuvettes==null)r.cuvettes=5});
}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const ok=o=>o&&Array.isArray(o.b)&&Array.isArray(o.r)&&Array.isArray(o.s)&&o.p&&Array.isArray(o.p.rules)&&Array.isArray(o.tabs);
const num=(v,d,mx)=>{v=+v;return isFinite(v)&&v>=0&&(mx==null||v<=mx)?v:d};
function sanitize(o){
 const str=(v,n)=>typeof v=='string'?v.trim().slice(0,n):'';
 const CATK=Object.keys(CATS),CCK=['*','~','san',...CATK];
 if(!Array.isArray(o.tabs))o.tabs=['Dashboard','Locaux','Secteurs','Semaine','Matériel','Paramètres'];
 o.tabs=o.tabs.filter(t=>typeof t=='string'&&t.trim()).map(t=>t.trim().slice(0,40));
 if(!o.tabs.length)o.tabs=['Dashboard','Locaux','Secteurs','Semaine','Matériel','Paramètres'];
 o.b=(Array.isArray(o.b)?o.b:[]).filter(x=>x&&str(x.name)).map(x=>({id:String(x.id||uid()).slice(0,12),name:str(x.name,80),code:String(x.code||'').trim().slice(0,10)}));
 o.r=(Array.isArray(o.r)?o.r:[]).filter(x=>x&&str(x.name)&&x.bid&&o.b.some(b=>b.id==x.bid)&&num(x.area)>0).map(x=>{const m={id:String(x.id||uid()).slice(0,12),bid:String(x.bid),name:str(x.name,80),area:num(x.area),category:CATK.includes(x.category)?x.category:'circulation'};
  if(m.category=='office')m.traffic=x.traffic=='low'?'low':'high';
  if(m.category=='canteen')m.floor=x.floor=='flotex'?'flotex':'tile';
  if(m.category=='bedroom')m.beds=Math.max(1,Math.round(num(x.beds,1)));
  if(m.category=='showers')m.cells=Math.max(1,Math.round(num(x.cells,1)));
  if(m.category=='classroom')m.tables=Math.round(num(x.tables,10));
  if(m.category.startsWith('sanitary'))m.cuvettes=Math.round(num(x.cuvettes,5));
  return m});
 const rids=new Set(o.r.map(x=>x.id));
 o.s=(Array.isArray(o.s)?o.s:[]).filter(x=>x&&str(x.name)).map(x=>{const fw={};if(x.fw&&typeof x.fw=='object')Object.entries(x.fw).forEach(([k,v])=>{if(typeof k=='string'&&isFinite(v)&&v>0)fw[k.slice(0,20)]=+v});
  return {id:String(x.id||uid()).slice(0,12),name:str(x.name,80),avail:num(x.avail,495)>0?num(x.avail,495):495,it:(Array.isArray(x.it)?x.it:[]).filter(a=>a&&a.room&&rids.has(String(a.room))).map(a=>({room:String(a.room),rules:(Array.isArray(a.rules)?a.rules:[]).filter(v=>typeof v=='string').slice(0,20),fw}))}});
 if(!o.p||typeof o.p!='object')o.p=DEF();
 const p=o.p;p.setup=num(p.setup,10);p.days=Math.min(7,Math.max(1,Math.round(num(p.days,5,7))||5));
 p.cls={c:num(p.cls&&p.cls.c,25),d:num(p.cls&&p.cls.d,15),v:num(p.cls&&p.cls.v,5)};
 p.rules=(Array.isArray(p.rules)?p.rules:[]).filter(r=>r&&str(r.id)&&str(r.label)&&CATK.includes(r.cat)&&['rate','unit'].includes(r.k)).map(r=>({id:str(r.id,20),label:str(r.label,80),cat:r.cat,when:r.when&&typeof r.when=='object'&&!Array.isArray(r.when)&&Object.values(r.when).every(v=>typeof v=='string')?r.when:null,k:r.k,a:num(r.a,0),b:num(r.b,5)>0?num(r.b,5):5,f:Array.isArray(r.f)&&isFinite(r.f[0])&&r.f[0]>0?[+r.f[0],r.f[1]=='w'?'w':'d']:[1,'d']}));
 if(!p.rules.length)p.rules=DEF().rules;
 if(!Array.isArray(o.m))o.m=DEFM();

 lastSnap=JSON.stringify(S);

// ── Moteur de calcul ──
const roomById=id=>S.r.find(x=>x.id==id),secOf=id=>S.s.find(s=>s.it.some(a=>a.room==id));
const match=(r,m)=>r.cat==m.category&&(!r.when||Object.entries(r.when).every(([k,v])=>m[k]==v));
const ruleMin=(r,m)=>r.k=='rate'?m.area/r.a*r.b:(m.category=='bedroom'?m.beds:m.cells)*r.b;
const dayF=(f,d)=>f[1]=='d'?f[0]:f[0]/d;
const fm=m=>{m=Math.round(m);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
function sday(s,dy){
 const p=S.p,L=[{l:'Prise de poste',m:p.setup,t:0}],W=[],cl=[];
 for(const a of s.it){
  const m=roomById(a.room);if(!m)continue;
  if(m.category=='classroom'){cl.push(m);continue}
  const c=p.rules.filter(r=>match(r,m)),use=c.length==1?c:c.filter(r=>a.rules.includes(r.id));
  if(!use.length){W.push('Choisir une règle pour '+m.name);continue}
  for(const r of use){const f=r.f[1]=='w'&&a.fw[r.id]>0?[a.fw[r.id],'w']:r.f;
   L.push({l:m.name+' ('+r.label+')',m:ruleMin(r,m)*dayF(f,p.days),t:2})}}
 const n=cl.length;
 if(n){const rest=n-1,d=Math.min(rest,Math.max(2,Math.min(3,rest>>1))),sh=dy%n;
  if(n<5||n>7)W.push('Lot de '+n+' classes : la règle prévoit 5 à 7 classes');
  cl.forEach((_,i)=>{const m=cl[(i+sh)%n],t=i<1?'c':i<1+d?'d':'v';
   L.push({l:m.name+' ('+{c:'complète',d:'dépoussiérage',v:'vérification'}[t]+')',m:p.cls[t],t:1})})}
 return{L,W,tot:L.reduce((x,y)=>x+y.m,0)}}

// ── Import CSV ──
function parseCSV(txt){
 txt=txt.replace(/^\uFEFF/,'');
 const first=(txt.split(/\r?\n/)[0]||'');
 const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<txt.length;i++){
  const c=txt[i];
  if(q){if(c=='"'&&txt[i+1]=='"'){cur+='"';i++}else if(c=='"')q=false;else cur+=c}
  else{if(c=='"')q=true;else if(c==sep){row.push(cur);cur=''}else if(c=='\r'&&txt[i+1]=='\n'){row.push(cur);rows.push(row);row=[];cur='';i++}else if(c=='\n'||c=='\r'){row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}}
 if(cur||row.length){row.push(cur);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()!=''))}

const cleanH=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
function mapCat(raw){
 const s=cleanH(raw||'');
 if(!s||s.includes('circul')||s.includes('infirm')||s.includes('autre'))return 'circulation';
 if(s.includes('classe'))return 'classroom';
 if(s.includes('bureau'))return 'office';
 if(s.includes('sanitaire')){return s.includes('int')?'sanitary_int':'sanitary_ext'}
 if(s.includes('chambre'))return 'bedroom';
 if(s.includes('douche'))return 'showers';
 if(s.includes('self')||s.includes('cantine'))return 'canteen';
 if(s.includes('cdi')||s.includes('biblio'))return 'library';
 if(s.includes('gym'))return 'gym';
 if(s.includes('escalier'))return 'stairs';
 return 'circulation'}

const IMPCOLS=[['bat','Bâtiment',['batiment']],['code','Code étab.',['code']],['piece','Pièce',['piece','local','nom']],['surf','Surface (m²)',['surface','m2']],['cat','Catégorie',['categorie']],['freq','Fréquentation',['frequentation']],['sol','Sol',['sol']],['lits','Lits',['lit']],['cells','Cellules',['cellule']],['tab','Tables',['table']],['cuv','Cuvettes',['cuvette']]];
function openImp(txt){
 const rows=parseCSV(txt);
 if(rows.length<2){alert('Le fichier CSV semble vide ou ne contient que des en-têtes.');return}
 const hdr=rows[0].map(cleanH);
 const col=(...keys)=>hdr.findIndex(h=>keys.some(k=>h.startsWith(k)||h.includes(k)));
 const map={};IMPCOLS.forEach(([k,,keys])=>{map[k]=col(...keys)});
 imp={rows,map,mode:S.b.length||S.r.length?'merge':'replace',result:null};
 render()
}
function impRow(r){
 const g=x=>imp.map[x]>=0?(r[imp.map[x]]||'').trim():'';
 const area=parseFloat(g('surf').replace(/\s/g,'').replace(',','.'));
 const cat=mapCat(g('cat'));
 return{bName:g('bat'),rName:g('piece'),area,cat,err:!g('bat')?'bâtiment manquant':!g('piece')?'pièce manquante':!(area>0)?'surface invalide ou manquante':null}
}
function impView(){
 const i=imp;
 if(i.result){const r=i.result;
  return `<div class="ovl"><section class="card"><h2>Import terminé</h2><p style="margin:.2rem 0 .8rem">• ${r.addedB} bâtiment(s) créé(s)<br>• ${r.addedR} pièce(s) ajoutée(s)${r.updatedR?`<br>• ${r.updatedR} pièce(s) mise(s) à jour`:''}${r.skipped?`<br>• ${r.skipped} ligne(s) ignorée(s)`:''}</p><div class="row"><button class="p" data-act="impclose">Fermer</button></div></section></div>`}
 const issues=[];
 i.rows.slice(1).forEach((r,ri)=>{const e=impRow(r);if(e.err)issues.push(`Ligne ${ri+2} : ${e.err}`)});
 const missing=['bat','piece','surf'].filter(k=>i.map[k]<0).map(k=>IMPCOLS.find(c=>c[0]==k)[1]);
 const SE=k=>`<select data-c="imap" data-f="${k}" aria-label="Colonne pour ${k}"><option value="-1" ${i.map[k]<0?'selected':''}>—</option>${i.rows[0].map((h,hi)=>`<option value="${hi}" ${i.map[k]==hi?'selected':''}>${esc(h)||'Colonne '+(hi+1)}</option>`).join('')}</select>`;
 const prev=i.rows.slice(1,9).map((r,ri)=>{const d=impRow(r);
  return `<tr><td>${ri+2}</td><td>${esc(d.bName)||'<span class="er">—</span>'}</td><td>${esc(d.rName)||'<span class="er">—</span>'}</td><td>${d.area>0?d.area:'<span class="er">?</span>'}</td><td><span class="badge">${CATS[d.cat]}</span></td><td class="${d.err?'er':'ok'}">${d.err||'✓'}</td></tr>`}).join('');
 return `<div class="ovl"><section class="card">
  <h2>Aperçu de l'import CSV</h2>
  <p class="mu" style="margin:0 0 .8rem">${i.rows.length-1} ligne(s) de données détectée(s). Vérifiez la correspondance des colonnes, puis lancez l'import.</p>
  ${missing.length?`<div class="alert-wa">⚠ Colonne(s) obligatoire(s) non détectée(s) : ${missing.join(', ')} — associez-les manuellement ci-dessous.</div>`:''}
  <h2 style="margin-top:.9rem">Correspondance des colonnes</h2>
  <div class="row">${IMPCOLS.map(([k,l])=>`<label class="mu" style="display:inline-flex;flex-direction:column;gap:.15rem;font-size:.75rem">${l}${SE(k)}</label>`).join('')}</div>
  <h2 style="margin-top:.9rem">Aperçu des premières lignes</h2>
  <div class="tw"><table><thead><tr><th>Ligne</th><th>Bâtiment</th><th>Pièce</th><th>Surface</th><th>Catégorie détectée</th><th>Statut</th></tr></thead><tbody>${prev}</tbody></table></div>
  ${issues.length?`<details ${issues.length<8?'open':''}><summary>${issues.length} ligne(s) seront ignorée(s)</summary><div class="mu" style="margin-top:.4rem">${issues.slice(0,10).map(esc).join('<br>')}${issues.length>10?`<br>… et ${issues.length-10} autre(s)`:''}</div></details>`:'<p class="ok" style="margin:.6rem 0 0">Aucune ligne rejetée.</p>'}
  <div class="row" style="margin-top:1rem">
   <span class="mu">Mode :</span>
   <label style="display:inline-flex;align-items:center;gap:.3rem"><input type="radio" name="imode" value="replace" ${i.mode=='replace'?'checked':''}> Remplacer les données actuelles</label>
   <label style="display:inline-flex;align-items:center;gap:.3rem"><input type="radio" name="imode" value="merge" ${i.mode=='merge'?'checked':''}> Fusionner avec les données actuelles</label>
  </div>
  <div class="row" style="margin-top:.6rem">
   <button class="p" data-act="impgo" ${missing.length?'disabled':''}>Lancer l'import</button>
   <button data-act="impcancel">Annuler</button>
  </div>
 </section></div>`
}
function applyImport(){
 const i=imp,m=i.map,g=(r,x)=>m[x]>=0?(r[m[x]]||'').trim():'';
 const newB=i.mode=='replace'?[]:[...S.b],newR=i.mode=='replace'?[]:[...S.r];
 let addedB=0,addedR=0,updatedR=0,skipped=0;
 for(let k=1;k<i.rows.length;k++){
  const r=i.rows[k],d=impRow(r);
  if(d.err){skipped++;continue}
  let code=g(r,'code').toUpperCase();
  if(!/^\d{7}[A-Z]$/.test(code))code='0000000A';
  let bat=newB.find(b=>b.name.toLowerCase()==d.bName.toLowerCase());
  if(!bat){bat={id:uid(),name:d.bName,code};newB.push(bat);addedB++}
  const room={id:uid(),bid:bat.id,name:d.rName,area:d.area,category:d.cat};
  if(d.cat=='office'){const f=cleanH(g(r,'freq'));room.traffic=f.includes('faible')?'low':'high'}
  if(d.cat=='canteen'){const fl=cleanH(g(r,'sol'));room.floor=fl.includes('flotex')?'flotex':'tile'}
  if(d.cat=='bedroom'){const v=parseInt(g(r,'lits'),10);room.beds=v>0?v:1}
  if(d.cat=='showers'){const v=parseInt(g(r,'cells'),10);room.cells=v>0?v:1}
  if(d.cat=='classroom'){const v=parseInt(g(r,'tab'),10);room.tables=!isNaN(v)&&v>=0?v:10}
  if(d.cat.startsWith('sanitary')){const v=parseInt(g(r,'cuv'),10);room.cuvettes=!isNaN(v)&&v>=0?v:5}
  const ex=newR.find(x=>x.bid==bat.id&&x.name.toLowerCase()==d.rName.toLowerCase());
  if(ex){room.id=ex.id;newR[newR.indexOf(ex)]=room;updatedR++}
  else{newR.push(room);addedR++}
 }
 if(!addedR&&!updatedR){i.result={addedB:0,addedR:0,updatedR:0,skipped};render();return}
 S.b=newB;S.r=newR;
 const validIds=new Set(S.r.map(x=>x.id));
 S.s.forEach(s=>s.it=s.it.filter(a=>validIds.has(a.room)));
 edit=null;save();
 i.result={addedB,addedR,updatedR,skipped};render()
}

// ── Exports CSV & impression ──
const csvOf=rows=>'\uFEFF'+rows.map(r=>r.map(c=>{c=String(c);return /[;"\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
function dl(name,txt,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime||'text/csv;charset=utf-8'}));a.download=name;a.click()}
function printDoc(){
 const days=S.p.days;
 return `<h2 style="margin:0 0 .2rem">Plan de sectorisation</h2><p class="mu" style="margin:0 0 1rem">${S.b.length} bâtiment(s) · ${S.r.length} pièce(s) · ${S.s.length} secteur(s) · édité le ${new Date().toLocaleDateString('fr-FR')}</p>
 ${Array.from({length:days},(_,dy)=>`<h3 style="margin:1rem 0 .5rem">Jour ${dy+1}</h3>
  ${S.s.map(s=>{const d=sday(s,dy);
   return `<div class="pr-sec"><h3>${esc(s.name)} — ${fm(d.tot)} / ${fm(s.avail)} min</h3>
    <table><tbody>${d.L.map(l=>`<tr><td>${esc(l.l)}</td><td style="text-align:right;width:6rem">${Math.round(l.m)} min</td></tr>`).join('')||'<tr><td>Aucune tâche</td><td></td></tr>'}</tbody></table>
    ${d.W.map(w=>`<div class="wa" style="font-size:.8rem">⚠ ${esc(w)}</div>`).join('')}
    ${S.m.length?`<table style="margin-top:.4rem"><tbody><tr><th>Matériel</th>${S.m.map(m=>`<th style="text-align:right">${esc(m.label)}</th>`).join('')}</tr><tr><td>Dotation</td>${S.m.map(m=>`<td style="text-align:right">${qty(m,s)}</td>`).join('')}</tr></tbody></table>`:''}
   </div>`}).join('')||'<p class="mu">Aucun secteur.</p>'}`).join('')}`
}

// ── Actions & Événements ──
const acts={
 tab:d=>{tab=d.ti!=null?S.tabs[+d.ti]:d.tab;edit=null;render()},
 undo:()=>undo(),
 goday:d=>{day=+d.d;tab='Secteurs';render()},
 print:()=>{$('#pr').innerHTML=printDoc();document.body.classList.add('printing');window.print()},
 exptime:()=>{const days=S.p.days,rows=[['Secteur','Jour','Local / tâche','Type','Minutes']];
  S.s.forEach(s=>{for(let dy=0;dy<days;dy++){const d=sday(s,dy);d.L.forEach(l=>rows.push([s.name,'Jour '+(dy+1),l.l,l.t==0?'Prise de poste':l.t==1?'Classe':'Autre local',Math.round(l.m*10)/10]))}});
  dl('temps_secteurs.csv',csvOf(rows))},
 expmat:()=>{const rows=[['Matériel',...S.s.map(s=>s.name),'Total']];
  S.m.forEach(m=>{const q=S.s.map(s=>qty(m,s));rows.push([m.label,...q,q.reduce((a,b)=>a+b,0)])});
  dl('dotations_materiel.csv',csvOf(rows))},
 impgo:()=>applyImport(),
 impcancel:()=>{imp=null;render()},
 impclose:()=>{imp=null;tab='Locaux';render()},
 restbk:()=>{try{const b=JSON.parse(localStorage.getItem(K2)||'null');if(!b||!b.d)return;if(!confirm('Restaurer la sauvegarde du '+new Date(b.day).toLocaleDateString('fr-FR')+' ? Les données actuelles seront remplacées (Ctrl+Z pour annuler).'))return;S=JSON.parse(JSON.stringify(b.d));sanitize(S);norm();tab=S.tabs[0];save();render()}catch(e){}},
 toggle:d=>{if(collapsed.has(d.id))collapsed.delete(d.id);else collapsed.add(d.id);render()},
 colall:()=>{S.s.forEach(s=>collapsed.add(s.id));render()},
 expall:()=>{collapsed.clear();render()},
 edb:d=>{edit={t:'b',id:d.id};render();scrollTo({top:0,behavior:'smooth'})},
 edr:d=>{edit={t:'r',id:d.id};render();scrollTo({top:0,behavior:'smooth'})},
 cancel:()=>{edit=null;render()},
 mdel:d=>{const m=S.m[d.mi];if(!confirm('Supprimer le matériel « '+m.label+' » ?'))return;S.m.splice(d.mi,1);save();render()},
 mrule:d=>{S.m[d.mi].rules.push({k:'sector',n:1});save();render()},
 mruledel:d=>{S.m[d.mi].rules.splice(d.ri,1);save();render()},
 mreset:()=>{if(confirm('Rétablir le matériel et ses règles par défaut ? Les matériels ajoutés seront supprimés.')){S.m=DEFM();save();render()}},
 delb:d=>{const b=S.b.find(x=>x.id==d.id);if(!confirm('Supprimer le bâtiment « '+b.name+' » et ses pièces ?'))return;const ids=S.r.filter(r=>r.bid==b.id).map(r=>r.id);S.s.forEach(s=>s.it=s.it.filter(a=>!ids.includes(a.room)));S.r=S.r.filter(r=>r.bid!=b.id);S.b=S.b.filter(x=>x!=b);edit=null;save();render()},
 delr:d=>{const m=roomById(d.id);if(!confirm('Supprimer la pièce « '+m.name+' » ?'))return;S.s.forEach(s=>s.it=s.it.filter(a=>a.room!=m.id));S.r=S.r.filter(x=>x!=m);edit=null;save();render()},
 nsec:()=>{S.s.push({id:uid(),name:'Secteur '+(S.s.length+1),avail:495,it:[]});save();render()},
 dels:d=>{const s=S.s.find(x=>x.id==d.id);if(!confirm('Supprimer le secteur « '+s.name+' » ? Ses pièces redeviennent non affectées.'))return;collapsed.delete(d.id);S.s=S.s.filter(x=>x!=s);save();render()},
 rm:d=>move(d.id,''),
 reset:()=>{if(confirm('Rétablir toutes les valeurs par défaut ?')){S.p=DEF();save();render()}},
 exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='secteurs.json';a.click()},
 imp:()=>$('#file').click(),
 impcsv:()=>$('#csvfile').click(),
 tplcsv:()=>{const bom='\uFEFF',csv='Bâtiment;Code établissement;Pièce;Surface (m²);Catégorie;Fréquentation;Sol;Lits;Cellules;Tables;Cuvettes\n"A1, INTER, EX";0290341N;Salle 101;45,89;Salle de classe;;;;;22;\n"A1, INTER, EX";0290341N;Sanitaires Garçons;20;Sanitaire externat;;;;;;4\n"A1, INTER, EX";0290341N;Bureau infos;14,19;Bureau;Très fréquenté;;;;;\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bom+csv],{type:'text/csv;charset=utf-8'}));a.download='modele_locaux.csv';a.click()},
 link:async()=>{try{fh=await showSaveFilePicker({suggestedName:'secteurs.json',types:[{accept:{'application/json':['.json']}}]});await write();head()}catch(e){}},
 demo:()=>{const b=uid();S.b.push({id:b,name:'Bâtiment A',code:'0123456A'});
  const add=(name,area,category,x)=>S.r.push({id:uid(),bid:b,name,area,category,...x});
  for(let i=1;i<=7;i++)add('Classe A'+i,50,'classroom',{tables:10});
  add('WC garçons',20,'sanitary_ext',{cuvettes:5});add('WC filles',15,'sanitary_ext',{cuvettes:5});add('Secrétariat',24,'office',{traffic:'high'});add('Chambre 101',12,'bedroom',{beds:3});add('Self',400,'canteen',{floor:'tile'});add('Gymnase',4600,'gym');
  S.s.push({id:uid(),name:'Matin 1',avail:495,it:[]});save();render()}};

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)acts[t.dataset.act](t.dataset)});
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id=='qloc'){qLoc=e.target.value;const pos=e.target.selectionStart;render();const el=$('#qloc');if(el){el.focus();el.setSelectionRange(pos,pos)}}
 else if(id=='qsec'){qSec=e.target.value;const pos=e.target.selectionStart;render();const el=$('#qsec');if(el){el.focus();el.setSelectionRange(pos,pos)}}
});

function move(rid,sid,silent){
 const m=roomById(rid),from=secOf(rid),to=S.s.find(s=>s.id==sid);if(from==to)return;
 if(!silent){const q=!to?'Retirer « '+m.name+' » du secteur « '+from.name+' » ?':from?'Déplacer « '+m.name+' » de « '+from.name+' » vers « '+to.name+' » ?':'Ajouter « '+m.name+' » au secteur « '+to.name+' » ?';
  if(!confirm(q))return}
 if(from)from.it=from.it.filter(a=>a.room!=rid);
 if(to)to.it.push({room:rid,rules:[],fw:{}});save();render()}

document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-drag],[data-ti],[data-tab]');if(!t)return;drag=t.dataset.drag?{room:t.dataset.drag}:t.dataset.ti!=null?{ti:+t.dataset.ti}:{tab:t.dataset.tab};e.dataTransfer.setData('text/plain','x')});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-zone]')||((drag&&(drag.tab||drag.ti!=null))&&e.target.closest('[data-ti]')))e.preventDefault();document.querySelectorAll('.over').forEach(z=>z.classList.remove('over'));const z=drag&&drag.room&&e.target.closest('[data-zone]');if(z)z.classList.add('over')});
document.addEventListener('drop',e=>{if(!drag)return;e.preventDefault();document.querySelectorAll('.over').forEach(z=>z.classList.remove('over'));
 if(drag.tab||drag.ti!=null){const t=e.target.closest('[data-ti]');if(t&&+t.dataset.ti!=drag.ti){const a=S.tabs,from=drag.ti!=null?drag.ti:a.indexOf(drag.tab);if(from>=0){const [x]=a.splice(from,1);const to=+t.dataset.ti;a.splice(to>from?to-1:to,0,x);save();render()}}}
 else{const z=e.target.closest('[data-zone]');if(z)move(drag.room,z.dataset.zone)}drag=null});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.over').forEach(z=>z.classList.remove('over'))});

document.addEventListener('change',e=>{
 const t=e.target,c=t.dataset.c;
 if(t.id=='catloc'){catLoc=t.value;render();return}
 if(t.name=='category'&&t.closest('form')){$('#ex').innerHTML=extra(t.value,edit&&edit.t=='r'?roomById(edit.id):null);return}
 if(t.name=='imode'){imp.mode=t.value;return}
 if(!c)return;
 if(c=='imap'){imp.map[t.dataset.f]=+t.value;render();return}
 if(c=='mvto'){if(t.value)move(t.dataset.r,t.value,true);return}
 if(c=='mvfrom'){move(t.dataset.r,t.value,true);return}
 const sec=S.s.find(s=>s.id==t.dataset.s),it=sec&&sec.it.find(a=>a.room==t.dataset.r),n=+t.value,p=S.p;
 if(c=='day'){day=n;render();return}
 if(c=='sname'){sec.name=t.value.trim()||sec.name}
 else if(c=='savail'){if(n>0)sec.avail=n}
 else if(c=='rchk'){const x=t.dataset.x;it.rules=t.checked?[...it.rules,x]:it.rules.filter(r=>r!=x)}
 else if(c=='rfw'){if(n>0)it.fw[t.dataset.x]=n}
 else if(c=='pset'){if(n>=0)p.setup=n}
 else if(c=='pdays'){if(n>=1&&n<=7)p.days=Math.round(n)}
 else if(c=='pcls'){if(n>=0)p.cls[t.dataset.x]=n}
 else if(c=='pr'){if(n>0)p.rules[t.dataset.i][t.dataset.x]=n}
 else if(c=='pf'){if(n>0)p.rules[t.dataset.i].f[0]=n}
 else if(c=='pfu'){p.rules[t.dataset.i].f[1]=t.value}
 else if(c=='mlab'){const m=S.m[t.dataset.mi];m.label=t.value.trim()||m.label}
 else if(c=='mn'){const u=S.m[t.dataset.mi].rules[t.dataset.ri],x=t.dataset.x;
  if(x=='n'){if(n>=0&&(u.k=='sector'||u.k=='room'||n>0))u.n=n}
  else{u[x]=t.value;if(x=='k'){if(u.k!='sector'&&!u.c)u.c='*';if(u.k=='unit'&&!u.u)u.u='tables';if((u.k=='area'||u.k=='unit')&&!(u.n>0))u.n=1}}}
 save();render()});

document.addEventListener('submit',e=>{
 const f=e.target.dataset.f;if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
 if(f=='m'){S.m.push({id:uid(),label:d.label.trim(),rules:[{k:'sector',n:1}]});save();render();return}
 if(f=='b'){const code=d.code.trim().toUpperCase();
  if(!/^\d{7}[A-Z]$/.test(code)){$('#eb').textContent='Code attendu : 7 chiffres et 1 lettre (ex. 0123456A).';return}
  const o=edit&&edit.t=='b'?S.b.find(x=>x.id==edit.id):null;
  if(o){o.name=d.name.trim();o.code=code}else S.b.push({id:uid(),name:d.name.trim(),code})}
 else{const name=d.name.trim(),area=+d.area;
  if(!(area>0)){$('#er').textContent='La surface doit être supérieure à 0.';return}
  const o=edit&&edit.t=='r'?roomById(edit.id):null;
  if(S.r.some(r=>r!==o&&r.bid==d.bid&&r.name.toLowerCase()==name.toLowerCase())){$('#er').textContent='Ce nom existe déjà dans ce bâtiment.';return}
  const m={id:o?o.id:uid(),bid:d.bid,name,area,category:d.category};
  if(d.traffic)m.traffic=d.traffic;if(d.floor)m.floor=d.floor;if(d.beds)m.beds=Math.max(1,Math.round(+d.beds));if(d.cells)m.cells=Math.max(1,Math.round(+d.cells));if(d.tables!=null&&d.tables!=='')m.tables=Math.max(0,Math.round(+d.tables));if(d.cuvettes!=null&&d.cuvettes!=='')m.cuvettes=Math.max(0,Math.round(+d.cuvettes));
  if(o){if(o.category!=m.category||o.floor!=m.floor||o.traffic!=m.traffic)S.s.forEach(s=>s.it.forEach(a=>{if(a.room==o.id){a.rules=[];a.fw={}}}));S.r[S.r.indexOf(o)]=m}else S.r.push(m)}
 edit=null;save();render()});

$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!ok(o))throw 0;if(!confirm('Remplacer les données actuelles par ce fichier ?'))return;S=o;norm();tab=S.tabs[0];save();render()}catch(x){alert('Fichier non reconnu : choisis un fichier exporté par cet outil.')}};
 rd.readAsText(f);e.target.value=''});
$('#csvfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>openImp(rd.result);
 rd.readAsText(f,'UTF-8');e.target.value=''});

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()=='z'&&!e.target.closest('input,textarea,select')){e.preventDefault();undo()}});
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');$('#pr').innerHTML=''});

render();
</script>
</body>
</html>
